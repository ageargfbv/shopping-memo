<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>買い物メモ</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<meta name="theme-color" content="#2f855a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="買い物メモ">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
:root{--bg:#f3f6f3;--card:#fff;--card2:#f1f4f1;--fg:#1a1d1b;--sub:#6b726d;--acc:#2f855a;--acc2:#3aa46f;--soft:#e4f3ea;--line:#e4e8e4;--danger:#e5484d;--shadow:0 6px 20px rgba(20,60,40,.10);--tab:66px}
@media (prefers-color-scheme:dark){:root{--bg:#101210;--card:#1b1e1b;--card2:#252925;--fg:#eef0ed;--sub:#9aa19c;--acc:#48bb78;--acc2:#38a169;--soft:#1f3a2b;--line:#2b302b;--shadow:0 6px 20px rgba(0,0,0,.4)}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,-apple-system,"Hiragino Sans","Yu Gothic",sans-serif;padding-bottom:calc(var(--tab) + env(safe-area-inset-bottom) + 24px);-webkit-text-size-adjust:100%}
button{font:inherit;border:0;background:none;color:inherit;padding:0;cursor:pointer}
input{font:inherit;color:var(--fg)}

/* 上のバナー */
.hero{background:linear-gradient(135deg,var(--acc) 0%,var(--acc2) 100%);color:#fff;padding:calc(env(safe-area-inset-top) + 18px) 16px 46px;border-radius:0 0 28px 28px}
.hero-in{max-width:560px;margin:0 auto}
.top{display:flex;justify-content:space-between;align-items:flex-start}
.date{font-size:13px;opacity:.85;letter-spacing:.02em}
h1{margin:2px 0 0;font-size:28px;line-height:1.2;letter-spacing:.01em}
.ico{width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.2);font-size:18px;display:grid;place-items:center;color:#fff}
.ico:active{background:rgba(255,255,255,.35)}
.prog{margin-top:16px}
.bar{height:8px;border-radius:99px;background:rgba(255,255,255,.28);overflow:hidden}
.bar i{display:block;height:100%;width:0;border-radius:99px;background:#fff;transition:width .45s cubic-bezier(.2,.8,.2,1)}
.ptxt{display:flex;justify-content:space-between;font-size:13px;margin-top:6px;opacity:.95}

main{max-width:560px;margin:-28px auto 0;padding:0 16px}

/* 追加バー */
.add{display:flex;gap:8px;background:var(--card);border-radius:18px;padding:6px 6px 6px 16px;box-shadow:var(--shadow);align-items:center}
.add input{flex:1;min-width:0;border:0;background:none;outline:0;padding:10px 0;font-size:17px}
.add input::placeholder{color:var(--sub)}
.add button{width:44px;height:44px;border-radius:14px;background:var(--acc);color:#fff;font-size:26px;line-height:1;display:grid;place-items:center;transition:transform .12s}
.add button:active{transform:scale(.92)}

/* 候補 */
.sug{display:flex;gap:8px;overflow-x:auto;padding:12px 0 2px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.sug::-webkit-scrollbar{display:none}
.sug:empty{display:none}
.sug .lb{flex:none;align-self:center;font-size:12px;color:var(--sub);padding-right:2px}
.chip{flex:none;padding:7px 13px;border-radius:99px;background:var(--card);border:1px solid var(--line);font-size:14px;white-space:nowrap}
.chip:active{background:var(--soft);border-color:var(--acc)}

/* カテゴリ */
.grp{margin-top:18px}
.gh{display:flex;align-items:center;gap:8px;padding:0 4px 8px;font-size:13px;font-weight:700;color:var(--sub)}
.gh .e{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:14px;background:var(--card);border:2px solid var(--c,var(--line))}
.gh .n{margin-left:auto;font-weight:600;font-size:12px}
.cardlist{background:var(--card);border-radius:16px;box-shadow:0 1px 3px rgba(0,0,0,.05);overflow:hidden}

/* 行 */
.row{position:relative;overflow:hidden}
.row+.row{border-top:1px solid var(--line)}
.swbg{position:absolute;inset:0;background:var(--danger);opacity:0;display:flex;align-items:center;justify-content:flex-end;padding-right:22px;color:#fff;font-weight:700;font-size:14px}
.front{position:relative;display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--card);transition:transform .22s cubic-bezier(.2,.8,.2,1),opacity .2s;touch-action:pan-y}
.chk{flex:none;width:28px;height:28px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;color:transparent;font-size:16px;font-weight:800;transition:background .18s,border-color .18s,transform .18s}
.chk:active{transform:scale(.88)}
.row .chk{border-color:#b9c2bb}
.row.done .chk{background:var(--acc);border-color:var(--acc);color:#fff}
.row.pop .chk{transform:scale(1.18)}
.row.pop .front{opacity:.35}
.body{flex:1;min-width:0}
.name{font-size:16.5px;font-weight:600;line-height:1.35;word-break:break-word}
.row.done .name{text-decoration:line-through;color:var(--sub);font-weight:500}
.meta{display:flex;flex-wrap:wrap;gap:4px 8px;margin-top:2px;font-size:12.5px;color:var(--sub);line-height:1.35}
.meta:empty{display:none}
.meta .q{background:var(--soft);color:var(--acc);border-radius:6px;padding:0 6px;font-weight:700}
.meta .p{color:var(--acc);font-weight:600}
.meta .p .old{color:#b7791f;font-weight:500}
.meta .m{color:var(--sub)}
.more{flex:none;color:var(--sub);font-size:20px;padding:4px 2px;letter-spacing:1px}

/* 済み */
.dh{display:flex;align-items:center;margin:22px 0 8px;padding:0 4px;color:var(--sub);font-size:13px;font-weight:700}
.dh .tg{display:flex;align-items:center;gap:6px}
.dh .tg span{transition:transform .2s}
.dh.closed .tg span{transform:rotate(-90deg)}
.dh .clr{margin-left:auto;color:var(--danger);font-weight:600;font-size:13px;padding:6px 4px}
.cardlist.dim{opacity:.85}

/* 空 */
.empty{text-align:center;color:var(--sub);padding:44px 0 20px}
.empty .big{font-size:56px;line-height:1;margin-bottom:8px}

/* 下のタブ */
.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;background:color-mix(in srgb,var(--card) 88%,transparent);background:var(--card);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:20}
.tabs a{flex:1;height:var(--tab);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;text-decoration:none;color:var(--sub);font-size:11px;font-weight:600}
.tabs a .i{font-size:22px;line-height:1}
.tabs a.cur{color:var(--acc)}

/* 編集シート */
#ov{position:fixed;inset:0;background:rgba(0,0,0,.42);opacity:0;pointer-events:none;transition:opacity .22s;z-index:30}
#ov.open{opacity:1;pointer-events:auto}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:31;background:var(--card);border-radius:22px 22px 0 0;padding:10px 18px calc(env(safe-area-inset-bottom) + 18px);transform:translateY(105%);transition:transform .28s cubic-bezier(.2,.8,.2,1);max-width:560px;margin:0 auto;box-shadow:0 -10px 40px rgba(0,0,0,.25);max-height:92vh;overflow:auto}
#sheet.open{transform:none}
.grab{width:40px;height:5px;border-radius:99px;background:var(--line);margin:0 auto 12px}
.fld{display:block;width:100%;border:1px solid var(--line);background:var(--card2);border-radius:12px;padding:12px 14px;font-size:17px;outline:0}
.fld:focus{border-color:var(--acc)}
.lbl{font-size:12px;color:var(--sub);font-weight:700;margin:16px 2px 6px}
.qty{display:flex;align-items:center;gap:14px}
.qty button{width:44px;height:44px;border-radius:12px;background:var(--card2);font-size:22px;font-weight:700}
.qty button:active{background:var(--soft)}
.qty b{min-width:40px;text-align:center;font-size:22px}
.cats{display:flex;flex-wrap:wrap;gap:8px}
.cats .chip.on{background:var(--acc);border-color:var(--acc);color:#fff}
.acts{display:flex;gap:10px;margin-top:20px}
.acts button{flex:1;padding:14px;border-radius:14px;font-weight:700;font-size:16px}
.acts .del{background:var(--card2);color:var(--danger)}
.acts .ok{background:var(--acc);color:#fff;flex:2}

/* 通知 */
#toast{position:fixed;left:50%;bottom:calc(var(--tab) + env(safe-area-inset-bottom) + 14px);transform:translate(-50%,20px);background:#26302a;color:#fff;border-radius:14px;padding:11px 16px;display:flex;gap:14px;align-items:center;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:40;max-width:calc(100% - 32px);box-shadow:0 8px 24px rgba(0,0,0,.3)}
#toast.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
#toast button{color:#7ee2a8;font-weight:700;white-space:nowrap}
</style>
</head>
<body>
<header class="hero">
  <div class="hero-in">
    <div class="top">
      <div><div class="date" id="date"></div><h1>買い物メモ</h1></div>
      <button class="ico" id="share" aria-label="リストを共有">⤴</button>
    </div>
    <div class="prog"><div class="bar"><i id="bar"></i></div><div class="ptxt"><span id="ptxt"></span><span id="pnum"></span></div></div>
  </div>
</header>
<main>
  <form id="f" class="add" autocomplete="off">
    <input id="t" placeholder="買うものを追加" enterkeyhint="done" autocapitalize="none" autocomplete="off" aria-label="買うもの">
    <button aria-label="追加">＋</button>
  </form>
  <div class="sug" id="sug"></div>
  <div id="list"></div>
  <section id="doneSec" hidden>
    <div class="dh" id="dh"><button class="tg" id="dtg"><span>▾</span><b id="dcnt"></b></button><button class="clr" id="clr">済みを消す</button></div>
    <div class="cardlist dim" id="done"></div>
  </section>
</main>
<nav class="tabs">
  <a class="cur" href="https://ageargfbv.github.io/shopping-memo/"><span class="i">📝</span>買い物メモ</a>
  <a href="https://ageargfbv.github.io/price-compare/"><span class="i">🏷️</span>最安くらべ</a>
</nav>
<div id="ov"></div>
<div id="sheet" role="dialog" aria-modal="true" aria-label="編集">
  <div class="grab"></div>
  <input class="fld" id="sName" aria-label="品名" autocomplete="off">
  <div class="lbl">数</div>
  <div class="qty"><button id="qm" aria-label="減らす">−</button><b id="qn">1</b><button id="qp" aria-label="増やす">＋</button></div>
  <div class="lbl">売り場</div>
  <div class="cats" id="cats"></div>
  <div class="lbl">メモ</div>
  <input class="fld" id="sMemo" placeholder="例：国産、赤" autocomplete="off" aria-label="メモ">
  <div class="acts"><button class="del" id="sDel">削除</button><button class="ok" id="sOk">完了</button></div>
</div>
<div id="toast"><span id="tmsg"></span><button id="tact" hidden></button></div>

<script>
const KEY='shopping-memo-v1',HKEY='shopping-memo-hist-v1';
const $=id=>document.getElementById(id);
const CATS=[
  {id:'veg',name:'野菜・果物',ico:'🥬',c:'#2f9e5b',kw:['野菜','キャベツ','レタス','にんじん','人参','玉ねぎ','たまねぎ','玉葱','じゃがいも','ジャガイモ','トマト','きゅうり','キュウリ','なす','ナス','茄子','ほうれん草','ねぎ','ネギ','大根','白菜','ブロッコリー','ピーマン','もやし','きのこ','しいたけ','椎茸','えのき','しめじ','かぼちゃ','ごぼう','れんこん','アボカド','レモン','りんご','リンゴ','バナナ','みかん','ミカン','いちご','イチゴ','ぶどう','ブドウ','果物','フルーツ','柿','梨','桃','キウイ','にんにく','ニンニク','生姜','しょうが','小松菜','水菜','セロリ','パプリカ','オクラ','枝豆','とうもろこし','さつまいも','サツマイモ','里芋','ズッキーニ','カボチャ','ミニトマト','スイカ','メロン','みょうが','しそ','パセリ']},
  {id:'dairy',name:'卵・乳・豆腐',ico:'🥚',c:'#f0a30a',kw:['牛乳','卵','たまご','玉子','ヨーグルト','チーズ','バター','豆腐','納豆','生クリーム','マーガリン','油揚げ','豆乳','厚揚げ']},
  {id:'meat',name:'肉・魚',ico:'🥩',c:'#e5484d',kw:['肉','豚','牛','鶏','ひき肉','ハム','ベーコン','ソーセージ','ウインナー','魚','鮭','さけ','サバ','さば','鯖','ぶり','ブリ','えび','エビ','いか','イカ','たこ','タコ','刺身','あさり','しらす','ツナ','まぐろ','マグロ','鯛','たら','さんま','あじ','アジ','ちくわ','かまぼこ','明太子','たらこ']},
  {id:'staple',name:'主食・調味料',ico:'🍚',c:'#c27c3a',kw:['米','パン','食パン','麺','うどん','そば','パスタ','スパゲッティ','ラーメン','小麦粉','砂糖','塩','醤油','しょうゆ','味噌','みそ','油','酢','みりん','だし','カレー','ルー','ソース','ケチャップ','マヨネーズ','ドレッシング','コショウ','胡椒','調味料','シリアル','ふりかけ','海苔','のり','缶','レトルト','乾麺','餅','もち','オートミール','ごま','はちみつ','ジャム']},
  {id:'drink',name:'飲み物・お菓子',ico:'🥤',c:'#2d9cdb',kw:['お茶','茶','水','ミネラル','コーヒー','珈琲','紅茶','ジュース','炭酸','ビール','ワイン','酒','お菓子','チョコ','クッキー','アイス','スナック','ガム','飴','あめ','せんべい','ポテチ','ゼリー','プリン','ケーキ','コーラ']},
  {id:'house',name:'日用品',ico:'🧴',c:'#8b5cf6',kw:['洗剤','シャンプー','リンス','コンディショナー','ティッシュ','トイレットペーパー','トイレ','ラップ','アルミ','ゴミ袋','ごみ袋','スポンジ','歯磨き','歯ブラシ','石鹸','せっけん','ハンドソープ','柔軟剤','マスク','電池','電球','綿棒','洗顔','化粧','カミソリ','キッチンペーパー','ペーパー','ボディソープ','ハンドクリーム','絆創膏','袋','ゴム手袋','漂白']},
  {id:'other',name:'その他',ico:'🛒',c:'#8a9099',kw:[]}
];
const CAT=Object.fromEntries(CATS.map(c=>[c.id,c]));
const guess=t=>{for(const c of CATS)if(c.kw.some(k=>t.includes(k)))return c.id;return 'other'};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const h=(tag,cls,text)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(text!=null)e.textContent=text;return e};

// ---- 保存 ----
let items=[],hist={};
try{const a=JSON.parse(localStorage.getItem(KEY)||'[]');if(Array.isArray(a))items=a}catch(e){}
try{const o=JSON.parse(localStorage.getItem(HKEY)||'{}');if(o&&typeof o==='object'&&!Array.isArray(o))hist=o}catch(e){}
// 前の版の {text,done} だけの記録もそのまま読める
items=items.filter(x=>x&&typeof x.text==='string'&&x.text.trim()).map((x,i)=>({
  id:x.id||uid(),text:x.text.trim(),done:!!x.done,
  qty:x.qty>0?Math.min(99,Math.floor(x.qty)):1,memo:typeof x.memo==='string'?x.memo:'',
  cat:CAT[x.cat]?x.cat:guess(x.text),ts:x.ts||Date.now()+i,doneTs:x.doneTs||0}));
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(items));localStorage.setItem(HKEY,JSON.stringify(hist))}catch(e){}};

// ---- 最安くらべ（同じサイトの別アプリ）の記録を読む ----
const PC_KEY='price-compare-v1',DAY=86400000;
const PC_UNIT={g:{per:100,disp:'100g',kind:'w'},ml:{per:100,disp:'100ml',kind:'v'},'個':{per:1,disp:'1個',kind:'c'}};
function pcRecs(){
  try{const a=JSON.parse(localStorage.getItem(PC_KEY)||'[]');return Array.isArray(a)?a.filter(r=>r&&r.item&&r.store&&PC_UNIT[r.unit]&&r.qty>0):[]}catch(e){return []}
}
const pcUp=r=>r.price/r.qty*PC_UNIT[r.unit].per;
function priceHint(text,recs){
  const t=text.trim().toLowerCase();if(!t)return null;
  let name=null;
  for(const r of recs){const n=r.item.trim().toLowerCase();if(n.length>=2&&t.includes(n)&&(!name||n.length>name.length))name=n}
  if(!name)return null;
  const mine=recs.filter(r=>r.item.trim().toLowerCase()===name);
  const kind=PC_UNIT[mine.reduce((a,b)=>b.ts>a.ts?b:a).unit].kind;
  const byStore=new Map();
  for(const r of mine){
    if(PC_UNIT[r.unit].kind!==kind)continue;
    const k=r.store.trim().toLowerCase(),o=byStore.get(k);
    if(!o||r.ts>o.ts)byStore.set(k,r);
  }
  const best=[...byStore.values()].sort((a,b)=>pcUp(a)-pcUp(b))[0];
  const up=Math.round(pcUp(best)*10)/10;
  const days=Math.floor((Date.now()-best.ts)/DAY);
  return {text:'最安 '+best.store+' '+up.toLocaleString('ja-JP')+'円/'+PC_UNIT[best.unit].disp,old:days>30?days+'日前':''};
}

// ---- 通知と取り消し ----
let toastTimer=0;
function toast(msg,label,fn){
  $('tmsg').textContent=msg;
  const b=$('tact');b.hidden=!label;
  if(label){b.textContent=label;b.onclick=()=>{hideToast();fn&&fn()}}
  $('toast').classList.add('on');
  clearTimeout(toastTimer);toastTimer=setTimeout(hideToast,label?6000:2200);
}
function hideToast(){$('toast').classList.remove('on')}
const snap=()=>JSON.parse(JSON.stringify(items));
const short=s=>s.length>12?s.slice(0,12)+'…':s;

// ---- 追加・変更 ----
function addText(raw){
  const parts=raw.split(/[、,，\n]+/).map(s=>s.trim()).filter(Boolean);
  let msg='';
  for(const p of parts){
    let text=p,qty=1;
    const m=p.match(/^(.*?)\s*[×xX＊*]\s*(\d{1,2})$/);
    if(m&&m[1].trim()){text=m[1].trim();qty=+m[2]}
    const same=items.find(x=>x.text.toLowerCase()===text.toLowerCase());
    if(same){
      if(same.done){same.done=false;same.doneTs=0;same.qty=qty;msg='「'+short(text)+'」をリストに戻しました'}
      else{same.qty=Math.min(99,same.qty+qty);msg='「'+short(text)+'」は入っていたので ×'+same.qty+' にしました'}
    }else{
      items.push({id:uid(),text,done:false,qty,memo:'',cat:guess(text),ts:Date.now(),doneTs:0});
    }
    hist[text]=(hist[text]||0)+1;
  }
  save();render();
  if(msg)toast(msg);
}
function toggle(it,li){
  it.done=!it.done;it.doneTs=it.done?Date.now():0;save();
  li.classList.add('pop');setTimeout(render,it.done?240:120);
}
function removeItem(it){
  const before=snap();
  items=items.filter(x=>x!==it);save();render();
  toast('「'+short(it.text)+'」を削除','元に戻す',()=>{items=before;save();render()});
}
function clearDone(){
  const before=snap(),n=items.filter(x=>x.done).length;if(!n)return;
  items=items.filter(x=>!x.done);save();render();
  toast('済み '+n+' 件を消しました','元に戻す',()=>{items=before;save();render()});
}

// ---- 表示 ----
let doneOpen=true,suppressClick=false;
function row(it,recs){
  const li=h('div','row'+(it.done?' done':''));
  const swbg=h('div','swbg','削除');li.append(swbg);
  const fr=h('div','front');
  const chk=h('button','chk','✓');chk.type='button';chk.setAttribute('role','checkbox');chk.setAttribute('aria-checked',String(it.done));chk.setAttribute('aria-label',it.text);
  chk.onclick=e=>{e.stopPropagation();toggle(it,li)};
  const body=h('div','body');body.append(h('div','name',it.text));
  const meta=h('div','meta');
  if(it.qty>1)meta.append(h('span','q','×'+it.qty));
  const ph=it.done?null:priceHint(it.text,recs);
  if(ph){const p=h('span','p',ph.text);if(ph.old)p.append(h('span','old',' ('+ph.old+')'));meta.append(p)}
  if(it.memo)meta.append(h('span','m',it.memo));
  body.append(meta);
  const more=h('button','more','⋯');more.type='button';more.setAttribute('aria-label',it.text+'を編集');
  fr.append(chk,body,more);li.append(fr);
  fr.onclick=()=>{if(!suppressClick)openSheet(it)};
  // 左にスワイプして削除
  let sx=0,sy=0,dx=0,sw=false;
  fr.addEventListener('touchstart',e=>{const t=e.touches[0];sx=t.clientX;sy=t.clientY;dx=0;sw=false},{passive:true});
  fr.addEventListener('touchmove',e=>{
    const t=e.touches[0],mx=t.clientX-sx,my=t.clientY-sy;
    if(!sw){if(Math.abs(mx)>10&&Math.abs(mx)>Math.abs(my)*1.5)sw=true;else return}
    dx=Math.max(-140,Math.min(0,mx));fr.style.transition='none';fr.style.transform='translateX('+dx+'px)';swbg.style.opacity='1';
  },{passive:true});
  fr.addEventListener('touchend',()=>{
    if(!sw)return;
    fr.style.transition='';suppressClick=true;setTimeout(()=>{suppressClick=false},80);
    if(dx<-90){fr.style.transform='translateX(-110%)';setTimeout(()=>removeItem(it),160)}else{fr.style.transform='';setTimeout(()=>{swbg.style.opacity='0'},220)}
    sw=false;
  });
  return li;
}
function suggestions(q){
  const inList=new Set(items.filter(x=>!x.done).map(x=>x.text.toLowerCase()));
  const pool=new Map(Object.entries(hist));
  for(const r of pcRecs()){const n=r.item.trim();if(n&&!pool.has(n))pool.set(n,0.5)}
  let arr=[...pool].filter(([n])=>!inList.has(n.toLowerCase()));
  q=q.trim().toLowerCase();
  if(q)arr=arr.filter(([n])=>n.toLowerCase().includes(q)&&n.toLowerCase()!==q);
  arr.sort((a,b)=>b[1]-a[1]);
  return arr.slice(0,q?6:12).map(a=>a[0]);
}
function renderSug(){
  const box=$('sug');box.textContent='';
  const list=suggestions($('t').value);
  if(!list.length)return;
  if(!$('t').value.trim())box.append(h('span','lb','よく買う'));
  for(const n of list){
    const b=h('button','chip','＋ '+n);b.type='button';
    b.onclick=()=>{$('t').value='';addText(n)};
    box.append(b);
  }
}
function render(){
  const recs=pcRecs();
  const pend=items.filter(x=>!x.done),dn=items.filter(x=>x.done).sort((a,b)=>b.doneTs-a.doneTs);
  const L=$('list');L.textContent='';
  if(!items.length){
    const e=h('div','empty');e.append(h('div','big','🛒'),h('div','','買うものはありません'));L.append(e);
  }
  for(const c of CATS){
    const g=pend.filter(x=>x.cat===c.id).sort((a,b)=>a.ts-b.ts);
    if(!g.length)continue;
    const sec=h('div','grp');
    const hd=h('div','gh');const em=h('span','e',c.ico);em.style.setProperty('--c',c.c);
    hd.append(em,h('span','',c.name),h('span','n',String(g.length)));
    const cl=h('div','cardlist');g.forEach(it=>cl.append(row(it,recs)));
    sec.append(hd,cl);L.append(sec);
  }
  $('doneSec').hidden=!dn.length;
  const D=$('done');D.textContent='';
  if(dn.length&&doneOpen)dn.forEach(it=>D.append(row(it,recs)));
  D.hidden=!doneOpen;
  $('dh').classList.toggle('closed',!doneOpen);
  $('dcnt').textContent='カゴに入れた '+dn.length;
  const total=items.length;
  $('bar').style.width=(total?dn.length/total*100:0)+'%';
  $('ptxt').textContent=!total?'空っぽです':!pend.length?'ぜんぶ買えた 🎉':'あと '+pend.length+' 点';
  $('pnum').textContent=total?dn.length+' / '+total:'';
  $('date').textContent=new Date().toLocaleDateString('ja-JP',{month:'long',day:'numeric',weekday:'short'});
  renderSug();
}

// ---- 編集シート ----
let cur=null;
function openSheet(it){
  cur=it;hideToast();
  $('sName').value=it.text;$('sMemo').value=it.memo;$('qn').textContent=it.qty;
  const box=$('cats');box.textContent='';
  for(const c of CATS){
    const b=h('button','chip'+(it.cat===c.id?' on':''),c.ico+' '+c.name);b.type='button';
    b.onclick=()=>{it.cat=c.id;save();[...box.children].forEach((x,i)=>x.classList.toggle('on',CATS[i].id===c.id))};
    box.append(b);
  }
  $('ov').classList.add('open');$('sheet').classList.add('open');
}
function closeSheet(){
  $('ov').classList.remove('open');$('sheet').classList.remove('open');
  if(document.activeElement&&document.activeElement.blur)document.activeElement.blur();
  cur=null;render();
}
$('sName').oninput=()=>{const v=$('sName').value.trim();if(cur&&v){cur.text=v;save()}};
$('sMemo').oninput=()=>{if(cur){cur.memo=$('sMemo').value.trim();save()}};
$('qm').onclick=()=>{if(cur&&cur.qty>1){cur.qty--;$('qn').textContent=cur.qty;save()}};
$('qp').onclick=()=>{if(cur&&cur.qty<99){cur.qty++;$('qn').textContent=cur.qty;save()}};
$('sOk').onclick=closeSheet;
$('ov').onclick=closeSheet;
$('sDel').onclick=()=>{const it=cur;if(!it)return;$('ov').classList.remove('open');$('sheet').classList.remove('open');cur=null;removeItem(it)};

// ---- 入力・共有・そのほか ----
$('f').onsubmit=e=>{e.preventDefault();const v=$('t').value.trim();if(!v)return;$('t').value='';addText(v)};
$('t').oninput=renderSug;
$('clr').onclick=clearDone;
$('dtg').onclick=()=>{doneOpen=!doneOpen;render()};
$('share').onclick=async()=>{
  const pend=items.filter(x=>!x.done);
  if(!pend.length){toast('残りの買い物はありません');return}
  let s='🛒 買い物リスト\n';
  for(const c of CATS){
    const g=pend.filter(x=>x.cat===c.id);if(!g.length)continue;
    s+='\n【'+c.name+'】\n'+g.map(x=>'・'+x.text+(x.qty>1?' ×'+x.qty:'')+(x.memo?'（'+x.memo+'）':'')).join('\n')+'\n';
  }
  try{
    if(navigator.share){await navigator.share({text:s})}
    else{await navigator.clipboard.writeText(s);toast('リストをコピーしました')}
  }catch(e){if(e&&e.name!=='AbortError')toast('共有できませんでした')}
};
// 最安くらべで記録して戻ってきたときに読み直す
addEventListener('pageshow',()=>render());
document.addEventListener('visibilitychange',()=>{if(!document.hidden)render()});
addEventListener('storage',e=>{if(e.key===PC_KEY)render()});
save();render();
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js'));
</script>
