<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>買い物メモ</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<meta name="theme-color" content="#55b834">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="買い物メモ">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
@font-face{font-family:"Dela Gothic One";src:url(dela.woff2) format("woff2");font-display:swap}
:root{--bg:#f2f9e6;--card:#fff;--card2:#eef6df;--fg:#1d2b12;--sub:#6a7a58;--acc:#4aa52e;--acc2:#8bd44a;--gd:#2f7d1e;--soft:#e2f5bd;--line:#dfeccb;--danger:#e5484d;--shadow:0 5px 0 var(--line),0 8px 18px rgba(50,90,20,.14);--tab:66px}
@media (prefers-color-scheme:dark){:root{--bg:#11190d;--card:#1b2615;--card2:#243020;--fg:#eef5e6;--sub:#a3b394;--acc:#6cc24a;--acc2:#4aa52e;--gd:#9be36f;--soft:#26401b;--line:#2c3a24;--shadow:0 5px 0 #0a1007,0 8px 18px rgba(0,0,0,.4)}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,-apple-system,"Hiragino Sans","Yu Gothic",sans-serif;padding-bottom:calc(var(--tab) + env(safe-area-inset-bottom) + 24px);-webkit-text-size-adjust:100%}
button{font:inherit;border:0;background:none;color:inherit;padding:0;cursor:pointer}
input{font:inherit;color:var(--fg)}

/* 上の帯（細く・全画面で同じ高さ） */
.hd{background:linear-gradient(135deg,#55b834,#8bd44a);color:#fff;padding:calc(env(safe-area-inset-top) + 12px) 16px 14px;border-radius:0 0 20px 20px;box-shadow:0 4px 0 rgba(47,125,30,.35)}
.hd-in{max-width:560px;margin:0 auto}
.top{display:flex;align-items:center;justify-content:space-between}
.logo{display:flex;align-items:center;gap:8px;font:400 21px/1 "Dela Gothic One",sans-serif;text-shadow:0 2px 0 rgba(30,80,10,.35)}
.logo i{width:34px;height:34px;border-radius:10px;background:#fff;display:grid;place-items:center;font-style:normal;font-size:19px;text-shadow:none}
.ico{width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.28);font-size:15px;display:grid;place-items:center;color:#fff}
.ico:active{background:rgba(255,255,255,.45)}
.pg{margin-top:10px;height:6px;border-radius:99px;background:rgba(255,255,255,.4);overflow:hidden}
.pg i{display:block;height:100%;width:0;border-radius:99px;background:#fff;transition:width .45s cubic-bezier(.2,.8,.2,1)}
main{max-width:560px;margin:0 auto;padding:12px 16px 0}

/* ずんだもんの吹き出し */
.bub{display:flex;gap:12px;align-items:center;margin:4px 0 12px;width:100%;text-align:left;padding:0}
.av{flex:none;width:64px;height:64px;border-radius:50%;background:#e2f5bd url(zun-normal.png) 0 0/105% auto no-repeat;border:3px solid #fff;box-shadow:0 3px 0 rgba(30,80,10,.22),0 0 0 3px #c4ec6f}
.av.w{background-image:url(zun-surprise.png)}
.say{position:relative;background:var(--card);color:var(--fg);border-radius:18px;padding:9px 13px;font-weight:800;font-size:14px;line-height:1.4;box-shadow:0 3px 0 var(--line)}
.say:before{content:"";position:absolute;left:-8px;top:50%;margin-top:-8px;border:8px solid transparent;border-right-color:var(--card);border-left:0}
.say b{color:var(--gd)}
.fin{text-align:center;padding:8px 0 4px}
.fin img{height:215px;display:block;margin:0 auto;filter:drop-shadow(0 6px 0 rgba(60,110,30,.22))}
.fin .say2{display:inline-block;margin-top:10px;background:var(--card);border-radius:20px;padding:10px 16px;font:400 20px/1.35 "Dela Gothic One",sans-serif;box-shadow:0 4px 0 var(--line)}
.fin p{font-weight:800;color:var(--sub);font-size:13px;margin:8px 0 0}
.credit{text-align:center;color:var(--sub);font-size:11px;margin:28px 0 8px}

/* 追加バー */
.add{display:flex;gap:8px;background:var(--card);border-radius:18px;padding:6px 6px 6px 16px;box-shadow:var(--shadow);align-items:center}
.add input{flex:1;min-width:0;border:0;background:none;outline:0;padding:10px 0;font-size:17px}
.add input::placeholder{color:var(--sub)}
[hidden]{display:none!important}
.pick{background:var(--card);border-radius:16px;padding:8px 14px 10px;margin-top:10px;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.pkrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:6px 0}
.pkrow .lb{width:100%;font-size:12px;color:var(--sub);font-weight:700}
.pkrow input{flex:1;min-width:130px;border:1px solid var(--line);background:var(--card2);border-radius:99px;padding:7px 13px;font-size:14px;outline:0}
.add .stbtn{width:auto;max-width:132px;height:36px;padding:0 12px;border-radius:99px;background:var(--card2);color:var(--fg);font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.add .stbtn.on{background:var(--soft);color:var(--acc)}
.add button{width:44px;height:44px;border-radius:14px;background:var(--acc);color:#fff;font-size:26px;line-height:1;display:grid;place-items:center;transition:transform .12s}
.add button:active{transform:scale(.92)}

/* 候補 */
.sug{display:flex;gap:8px;overflow-x:auto;padding:12px 0 2px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.sug::-webkit-scrollbar{display:none}
.sug:empty{display:none}
.sug .lb{flex:none;align-self:center;font-size:12px;color:var(--sub);padding-right:2px}
.chip{flex:none;padding:7px 13px;border-radius:99px;background:var(--card);border:1px solid var(--line);font-size:14px;white-space:nowrap}
.chip:active{background:var(--soft);border-color:var(--acc)}

/* カテゴリ */
.grp{margin-top:18px}
.gh{display:flex;align-items:center;gap:8px;padding:0 4px 8px;font-size:13px;font-weight:700;color:var(--sub)}
.gh .e{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:14px;background:var(--card);border:2px solid var(--c,var(--line))}
.gh .n{margin-left:auto;font-weight:600;font-size:12px}
.cardlist{background:var(--card);border-radius:16px;box-shadow:0 1px 3px rgba(0,0,0,.05);overflow:hidden}

/* 行 */
.row{position:relative;overflow:hidden}
.row+.row{border-top:1px solid var(--line)}
.swbg{position:absolute;inset:0;background:var(--danger);opacity:0;display:flex;align-items:center;justify-content:flex-end;padding-right:22px;color:#fff;font-weight:700;font-size:14px}
.front{position:relative;display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--card);transition:transform .22s cubic-bezier(.2,.8,.2,1),opacity .2s;touch-action:pan-y}
.chk{flex:none;width:28px;height:28px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;color:transparent;font-size:16px;font-weight:800;transition:background .18s,border-color .18s,transform .18s}
.chk:active{transform:scale(.88)}
.row .chk{border-color:#b9cfa0}
.row.done .chk{background:var(--acc);border-color:var(--acc);color:#fff}
.row.pop .chk{transform:scale(1.18)}
.row.pop .front{opacity:.35}
.body{flex:1;min-width:0}
.name{font-size:16.5px;font-weight:600;line-height:1.35;word-break:break-word}
.row.done .name{text-decoration:line-through;color:var(--sub);font-weight:500}
.meta{display:flex;flex-wrap:wrap;gap:4px 8px;margin-top:2px;font-size:12.5px;color:var(--sub);line-height:1.35}
.meta:empty{display:none}
.meta .q{background:var(--soft);color:var(--acc);border-radius:6px;padding:0 6px;font-weight:700}
.meta .p{color:var(--acc);font-weight:600}
.meta .p .old{color:#b7791f;font-weight:500}
.meta .m{color:var(--sub)}
.more{flex:none;color:var(--sub);font-size:20px;padding:4px 2px;letter-spacing:1px}

/* 済み */
.dh{display:flex;align-items:center;margin:22px 0 8px;padding:0 4px;color:var(--sub);font-size:13px;font-weight:700}
.dh .tg{display:flex;align-items:center;gap:6px}
.dh .tg span{transition:transform .2s}
.dh.closed .tg span{transform:rotate(-90deg)}
.dh .clr{margin-left:auto;color:var(--danger);font-weight:600;font-size:13px;padding:6px 4px}
.cardlist.dim{opacity:.85}

/* 空 */
.empty{text-align:center;color:var(--sub);padding:44px 0 20px}
.empty .big{font-size:56px;line-height:1;margin-bottom:8px}

/* 下のタブ */
.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;background:color-mix(in srgb,var(--card) 88%,transparent);background:var(--card);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:20}
.tabs a{flex:1;height:var(--tab);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;text-decoration:none;color:var(--sub);font-size:11px;font-weight:600}
.tabs a .i{font-size:22px;line-height:1}
.tabs a.cur{color:var(--acc)}

/* 編集シート */
#ov{position:fixed;inset:0;background:rgba(0,0,0,.42);opacity:0;pointer-events:none;transition:opacity .22s;z-index:30}
#ov.open{opacity:1;pointer-events:auto}
#sheet,#sheet2{position:fixed;left:0;right:0;bottom:0;z-index:31;background:var(--card);border-radius:22px 22px 0 0;padding:10px 18px calc(env(safe-area-inset-bottom) + 18px);transform:translateY(105%);visibility:hidden;transition:transform .28s cubic-bezier(.2,.8,.2,1),visibility 0s .28s;max-width:560px;margin:0 auto;box-shadow:0 -10px 40px rgba(0,0,0,.25);max-height:92vh;overflow:auto}
#sheet.open,#sheet2.open{transform:none;visibility:visible;transition-delay:0s}
.tools{display:flex;gap:8px}
.warn{display:block;width:100%;margin-top:12px;text-align:left;background:#fff4dc;color:#8a5a00;border-radius:14px;padding:10px 14px;font-size:14px;font-weight:600}
@media (prefers-color-scheme:dark){.warn{background:#3a2f12;color:#f3c76a}}
.seg{display:flex;gap:8px;margin-bottom:10px}
.seg button{flex:1;padding:10px 4px;border-radius:12px;background:var(--card2);font-weight:700;font-size:13.5px;color:var(--sub);white-space:nowrap}
.seg button.on{background:var(--acc);color:#fff}
.srow{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.sname{flex:1;min-width:0}
.sname b{display:block;font-size:16px}
.sname .sub{display:block;font-size:12.5px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sname .late{color:var(--danger);font-weight:700}
.sname .soon{color:#b7791f;font-weight:700}
.sadd{flex:none;padding:9px 14px;border-radius:12px;background:var(--acc);color:#fff;font-weight:700;font-size:14px}
.sdel{flex:none;color:var(--sub);padding:8px;font-size:16px}
.sform{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.sform .fld{flex:1;min-width:140px}
.stk{color:#b7791f;font-weight:600}
.srow .chk{border-color:#b9cfa0}
.srow .chk.on{background:var(--acc);border-color:var(--acc);color:#fff}
.srow.have{opacity:.5}
.srow .sub.g{color:var(--acc);font-weight:700}
.sel{flex:none;max-width:108px;border:2px solid var(--line);background:var(--card2);color:var(--fg);border-radius:99px;padding:5px 8px;font:700 12px system-ui,sans-serif}
.gl{display:flex;align-items:center;font-size:12px;font-weight:800;color:var(--sub);margin:16px 2px 0;width:100%;text-align:left}
.gl .n{margin-left:auto}
.gl .ar{display:inline-block;margin-right:6px;transition:transform .2s}
.gl.closed .ar{transform:rotate(-90deg)}
.wide{display:block;width:100%;margin-top:16px;padding:14px;border-radius:16px;background:var(--acc);color:#fff;font:400 16px "Dela Gothic One",sans-serif;text-align:center;box-shadow:0 4px 0 var(--gd)}
.wide:disabled{opacity:.45;box-shadow:none}
.dchip{display:inline-flex;align-items:center;gap:2px;flex:none;background:var(--card);border:2px solid var(--acc2);border-radius:99px;padding:0 4px 0 13px;font-size:14px;white-space:nowrap}
.dchip button{padding:7px 0}
.dchip .x{color:var(--sub);padding:7px 9px;font-size:13px}
.dchip small{color:var(--sub);font-size:11.5px;margin-left:4px}
#ask{position:fixed;left:50%;bottom:calc(var(--tab) + env(safe-area-inset-bottom) + 14px);transform:translate(-50%,20px);background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:16px;padding:10px 12px;display:flex;gap:8px;align-items:center;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:40;width:calc(100% - 24px);max-width:536px;box-shadow:0 8px 24px rgba(0,0,0,.25)}
#ask.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
#ask span{flex:1;min-width:0;line-height:1.3}
#ask input{width:84px;border:1px solid var(--line);background:var(--card2);border-radius:10px;padding:9px 10px;font-size:17px;outline:0;text-align:right}
#ask #askOk{background:var(--acc);color:#fff;border-radius:10px;padding:9px 14px;font-weight:700}
#ask #askX{color:var(--sub);padding:6px}
.grab{width:40px;height:5px;border-radius:99px;background:var(--line);margin:0 auto 12px}
.fld{display:block;width:100%;border:1px solid var(--line);background:var(--card2);border-radius:12px;padding:12px 14px;font-size:17px;outline:0}
.fld:focus{border-color:var(--acc)}
.lbl{font-size:12px;color:var(--sub);font-weight:700;margin:16px 2px 6px}
.qty{display:flex;align-items:center;gap:14px}
.qty button{width:44px;height:44px;border-radius:12px;background:var(--card2);font-size:22px;font-weight:700}
.qty button:active{background:var(--soft)}
.qty b{min-width:40px;text-align:center;font-size:22px}
.cats{display:flex;flex-wrap:wrap;gap:8px}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff}
.meta .p.w{color:#b7791f}
.meta .st{border-radius:6px;padding:0 6px;font-weight:700}
.bh{display:flex;align-items:center;margin:24px 4px 0;font-size:15px;font-weight:800}
.bh .n{margin-left:auto;font-size:12px;font-weight:600;color:var(--sub)}
.bh.fold{width:calc(100% - 8px);text-align:left;color:var(--sub)}
.bh.fold .ar{display:inline-block;margin-right:6px;transition:transform .2s}
.bh.fold.closed .ar{transform:rotate(-90deg)}
.none{text-align:center;color:var(--sub);padding:28px 0 4px}
.acts{display:flex;gap:10px;margin-top:20px}
.acts button{flex:1;padding:14px;border-radius:14px;font-weight:700;font-size:16px}
.acts .del{background:var(--card2);color:var(--danger)}
.acts .ok{background:var(--acc);color:#fff;flex:2}

/* 通知 */
#toast{position:fixed;left:50%;bottom:calc(var(--tab) + env(safe-area-inset-bottom) + 14px);transform:translate(-50%,20px);background:#26302a;color:#fff;border-radius:14px;padding:11px 16px;display:flex;gap:14px;align-items:center;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:40;max-width:calc(100% - 32px);box-shadow:0 8px 24px rgba(0,0,0,.3)}
#toast.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
#toast button{color:#7ee2a8;font-weight:700;white-space:nowrap}
</style>
</head>
<body>
<header class="hd">
  <div class="hd-in">
    <div class="top">
      <div class="logo"><i>🛒</i>ずんだメモ</div>
      <div class="tools">
        <button class="ico" id="bSets" aria-label="セット">📋</button>
        <button class="ico" id="bReg" aria-label="定番">🔁</button>
        <button class="ico" id="bStock" aria-label="うちにある物">🧊</button>
        <button class="ico" id="share" aria-label="リストを共有">⤴</button>
      </div>
    </div>
    <div class="pg"><i id="bar"></i></div>
  </div>
</header>
<main>
  <button class="bub" id="bub" type="button"><div class="av" id="av"></div><div class="say" id="say"></div></button>
  <div class="fin" id="fin" hidden><img src="zun-smile.png" alt=""><div class="say2">ぜんぶ買えたのだ！<br>えらいのだ！</div><p id="finTxt"></p></div>
  <form id="f" class="add" autocomplete="off">
    <input id="t" placeholder="買うものを足すのだ" enterkeyhint="done" autocapitalize="none" autocomplete="off" aria-label="買うもの">
    <button type="button" class="stbtn" id="addSt" aria-label="買う店を選ぶ">🏪 おまかせ</button>
    <button aria-label="追加">＋</button>
  </form>
  <div class="pick" id="addStRow" hidden></div>
  <div class="sug" id="tstore"></div>
  <div class="sug" id="due"></div>
  <div class="sug" id="sug"></div>
  <div id="list"></div>
  <section id="doneSec" hidden>
    <div class="dh" id="dh"><button class="tg" id="dtg"><span>▾</span><b id="dcnt"></b></button><button class="clr" id="clr">済みを消すのだ</button></div>
    <div class="cardlist dim" id="done"></div>
  </section>
  <p class="credit">立ち絵：坂本アヒルさん</p>
</main>
<nav class="tabs">
  <a class="cur" href="https://ageargfbv.github.io/shopping-memo/"><span class="i">📝</span>買い物メモ</a>
  <a href="https://ageargfbv.github.io/price-compare/"><span class="i">🏷️</span>最安くらべ</a>
</nav>
<div id="ov"></div>
<div id="sheet" role="dialog" aria-modal="true" aria-label="編集">
  <div class="grab"></div>
  <input class="fld" id="sName" aria-label="品名" autocomplete="off">
  <div class="lbl">数</div>
  <div class="qty"><button id="qm" aria-label="減らす">−</button><b id="qn">1</b><button id="qp" aria-label="増やす">＋</button></div>
  <div class="lbl">売り場</div>
  <div class="cats" id="cats"></div>
  <div class="lbl">買う店</div>
  <div class="cats" id="stores"></div>
  <input class="fld" id="sStore" placeholder="店を追加（例：サンディ）" autocomplete="off" aria-label="店を追加" style="margin-top:8px">
  <div class="lbl">定番</div>
  <div class="cats"><button class="chip" id="sReg" type="button"></button></div>
  <div class="lbl">メモ</div>
  <input class="fld" id="sMemo" placeholder="例：国産、赤" autocomplete="off" aria-label="メモ">
  <div class="acts"><button class="del" id="sDel">削除</button><button class="ok" id="sOk">完了</button></div>
</div>
<div id="sheet2" role="dialog" aria-modal="true" aria-label="セットとうちにある物">
  <div class="grab"></div>
  <div class="seg"><button id="m1">📋 セット</button><button id="m3">🔁 定番</button><button id="m2">🧊 うちにある物</button></div>
  <div id="p2"></div>
  <div class="acts"><button class="ok" id="s2Ok">閉じる</button></div>
</div>
<div id="ask"><span id="askMsg"></span><input id="askIn" type="number" inputmode="numeric" min="1" placeholder="円" aria-label="値段"><button id="askOk">記録</button><button id="askX" aria-label="閉じる">✕</button></div>
<div id="toast"><span id="tmsg"></span><button id="tact" hidden></button></div>

<script>
const KEY='shopping-memo-v1',HKEY='shopping-memo-hist-v1';
const $=id=>document.getElementById(id);
// 2026-09-30 本人の依頼：入力済みの情報をいったん全部消す。この端末で最初に開いた1回だけ（印を残すので、あとは消さない）。最安くらべの記録には触らない
try{
  if(localStorage.getItem('shopping-memo-reset')!=='2026-09-30'){
    ['shopping-memo-v1','shopping-memo-hist-v1','shopping-memo-store-v1','shopping-memo-sets-v1','shopping-memo-stock-v1'].forEach(k=>localStorage.removeItem(k));
    localStorage.setItem('shopping-memo-reset','2026-09-30');
  }
}catch(e){}
const CATS=[

// ---- 最安くらべ（同じサイトの別アプリ）の記録を読む ----
const PC_KEY='price-compare-v1',DAY=86400000;
const PC_UNIT={g:{per:100,disp:'100g',kind:'w'},ml:{per:100,disp:'100ml',kind:'v'},'個':{per:1,disp:'1個',kind:'c'}};
function pcRecs(){
  try{const a=JSON.parse(localStorage.getItem(PC_KEY)||'[]');return Array.isArray(a)?a.filter(r=>r&&r.item&&r.store&&PC_UNIT[r.unit]&&r.qty>0):[]}catch(e){return []}
}
const pcUp=r=>r.price/r.qty*PC_UNIT[r.unit].per;
// 品名に合う記録を店ごとの最新にして、安い順に並べる。{list:[{store,up,unit,ts}],best}
function priceInfo(text,recs){
  const t=text.trim().toLowerCase();if(!t)return null;
  let name=null;
  for(const r of recs){const n=r.item.trim().toLowerCase();if(n.length>=2&&t.includes(n)&&(!name||n.length>name.length))name=n}
  if(!name)return null;
  const mine=recs.filter(r=>r.item.trim().toLowerCase()===name);
  const kind=PC_UNIT[mine.reduce((a,b)=>b.ts>a.ts?b:a).unit].kind;
  const byStore=new Map();
  for(const r of mine){
    if(PC_UNIT[r.unit].kind!==kind)continue;
    const k=r.store.trim().toLowerCase(),o=byStore.get(k);
    if(!o||r.ts>o.ts)byStore.set(k,r);
  }
  const list=[...byStore.values()].map(r=>({store:r.store.trim(),up:pcUp(r),unit:r.unit,ts:r.ts})).sort((a,b)=>a.up-b.up);
  return {list,best:list[0]};
}
const fmt=x=>(Math.round(x.up*10)/10).toLocaleString('ja-JP')+'円/'+PC_UNIT[x.unit].disp;
function priceHint(text,recs){
  const i=priceInfo(text,recs);if(!i)return null;
  const days=Math.floor((Date.now()-i.best.ts)/DAY);
  return {text:i.best.store+'が最安なのだ '+fmt(i.best),old:days>30?days+'日前':''};
}

const norm=s=>String(s||'').normalize('NFKC').trim().toLowerCase();
const sameStore=(a,b)=>{a=norm(a);b=norm(b);if(!a||!b)return false;return a===b||(Math.min(a.length,b.length)>=3&&(a.includes(b)||b.includes(a)))};
function knownStores(){
  const m=[];
  const add=(name,ts)=>{name=String(name||'').trim();if(!name)return;const o=m.find(x=>sameStore(x.name,name));if(o){if(ts>o.ts)o.ts=ts}else m.push({name,ts})};
  for(const r of pcRecs())add(r.store,r.ts);
  for(const it of items)add(it.store,0);
  if(todayStore)add(todayStore,0);
  return m.sort((a,b)=>b.ts-a.ts).map(x=>x.name);
}
const hue=s=>{let n=0;for(const ch of norm(s))n=(n*31+ch.charCodeAt(0))%360;return n};
// 品 it を、今日の店 S で買う物か・どこでもいい物か・他の店で買う物かに分ける
function place(it,info,S){
  const own=it.store;
  const mine=info?info.list.find(x=>sameStore(x.store,S)):null,best=info?info.best:null;
  if(own){
    if(!sameStore(own,S))return {b:'other'};
    if(!best)return {b:'here'};
    if(!mine)return {b:'here',note:best.store+'が最安なのだ '+fmt(best)+'（ここは未確認）',cls:'w'};
    if(mine.up<=best.up+1e-9)return {b:'here',note:'最安なのだ '+fmt(mine)};
    if(mine.up<=best.up*1.05)return {b:'here',note:'ほぼ最安なのだ '+fmt(mine)};
    return {b:'here',note:best.store+'の方が安いのだ（−'+Math.round((mine.up-best.up)*10)/10+'円/'+PC_UNIT[mine.unit].disp+'）',cls:'w'};
  }
  if(!info)return {b:'any'};
  if(mine){
    if(mine.up<=best.up+1e-9)return {b:'here',note:'最安なのだ '+fmt(mine)};
    if(mine.up<=best.up*1.05)return {b:'here',note:'ほぼ最安なのだ '+fmt(mine)};
    return {b:'other',note:best.store+'が安いのだ（−'+Math.round((mine.up-best.up)*10)/10+'円/'+PC_UNIT[mine.unit].disp+'）',cls:'w'};
  }
  return {b:'any',note:best.store+'が最安なのだ '+fmt(best)+'（ここは未確認）',cls:'w'};
}

// 1品を足す。同じ物が入っていれば数を足すか、済みならリストに戻す。戻り値は知らせる文（無ければ ''）
function putItem(text,qty,store,cat){

  const same=items.find(x=>x.text.toLowerCase()===text.toLowerCase());
  if(same){
    if(store)same.store=store;

    else{same.qty=Math.min(99,same.qty+qty);msg='「'+short(text)+'」は入っていたので ×'+same.qty+' にしたのだ'}
  }else{
    items.push({id:uid(),text,done:false,qty,memo:'',store:store||'',cat:cat||guess(text),ts:Date.now(),doneTs:0});
  }
  hist[text]=(hist[text]||0)+1;
  return msg;
}
function addText(raw){
  const parts=raw.split(/[、,，\n]+/).map(s=>s.trim()).filter(Boolean);

  for(const p of parts){
    let text=p,qty=1;
    const m=p.match(/^(.*?)\s*[×xX＊*]\s*(\d{1,2})$/);
    if(m&&m[1].trim()){text=m[1].trim();qty=+m[2]}

// ---- 買う間隔を覚えて「そろそろ」を出す ----
// 同じ日に2回チェックしても1回と数える。3回以上買った物だけ、間隔（中央値）を出す
// store は買った店（分かれば）。買った回ごとに t と同じ順で ss に残し、よく買う店を「そろそろ」に添える
function logBuy(name,store){
  const k=norm(name),o=buyLog[k]||(buyLog[k]={n:name,t:[],s:0}),last=o.t[o.t.length-1];
  o.n=name;
  if(!Array.isArray(o.ss))o.ss=[];
  while(o.ss.length<o.t.length)o.ss.unshift('');
  if(!last||Date.now()-last>12*3600e3){
    o.t.push(Date.now());o.ss.push((store||'').trim());
    if(o.t.length>12){o.t.shift();o.ss.shift()}
  }
  saveLog();
}
// チェックを外したとき（押し間違い）は、直前の記録を取り消す
function unlogBuy(name){
  const o=buyLog[norm(name)];
  if(o&&o.t.length&&Date.now()-o.t[o.t.length-1]<10*60000){o.t.pop();if(Array.isArray(o.ss))o.ss.pop();saveLog()}
}
// よく買う店：2回以上、かつ店が分かっている回の半分以上
function usualStore(o){
  const c=new Map();
  for(const s of (o.ss||[])){if(s){const k=norm(s),e=c.get(k);if(e)e.n++;else c.set(k,{name:s,n:1})}}
  const top=[...c.values()].sort((a,b)=>b.n-a.n)[0],known=(o.ss||[]).filter(Boolean).length;
  return top&&top.n>=2&&top.n/known>=0.5?top.name:'';
}
function dueList(){
  const now=Date.now(),inList=new Set(items.filter(x=>!x.done).map(x=>norm(x.text))),out=[];
  for(const k in buyLog){
    const o=buyLog[k];
    if(!o||!Array.isArray(o.t)||o.t.length<3||inList.has(k))continue;
    const gaps=[];for(let i=1;i<o.t.length;i++)gaps.push((o.t[i]-o.t[i-1])/DAY);
    gaps.sort((a,b)=>a-b);
    const med=gaps[Math.floor(gaps.length/2)];
    if(med<2)continue;                               // ほぼ毎日買う物は対象にしない
    const since=(now-o.t[o.t.length-1])/DAY;
    if(since>=med*0.85&&now>(o.s||0))out.push({k,name:o.n,med:Math.round(med),since:Math.floor(since),over:since/med,st:usualStore(o)});
  }
  return out.sort((a,b)=>b.over-a.over).slice(0,6);
}
function renderDue(){
  const box=$('due');box.textContent='';
  const list=dueList();
  if(!list.length)return;

    x.onclick=()=>{buyLog[d.k].s=Date.now()+d.med*DAY;saveLog();render();toast('「'+short(d.name)+'」は、次の間隔まで出さないのだ')};
    c.append(b,x);box.append(c);

}

function catGroups(box,list,note){

    const g=list.filter(x=>x.cat===c.id).sort((a,b)=>a.ts-b.ts);
    if(!g.length)continue;

// 近くの店を自動で選ぶ（位置は端末の中だけ。店の座標は最安くらべが記録したもの）
let lastLoc=0;
const rad=x=>x*Math.PI/180;
function dist(a,b){
  const s=Math.sin(rad(b.lat-a.lat)/2)**2+Math.cos(rad(a.lat))*Math.cos(rad(b.lat))*Math.sin(rad(b.lng-a.lng)/2)**2;
  return 12742000*Math.asin(Math.sqrt(s));
}
function storeLocs(){
  const m=new Map();
  for(const r of pcRecs()){
    if(typeof r.lat!=='number'||typeof r.lng!=='number')continue;
    const k=r.store.trim(),o=m.get(k);
    if(!o||r.ts>o.ts)m.set(k,{store:k,lat:r.lat,lng:r.lng,ts:r.ts});
  }
  return [...m.values()];
}
async function autoLocate(force){
  if(!navigator.geolocation)return;
  if(Date.now()-manualAt<30*60000)return;          // 手で選んだ直後は、位置で上書きしない
  if(!force&&Date.now()-lastLoc<60000)return;
  const locs=storeLocs();
  if(!locs.length)return;                          // 座標のある店が無ければ、位置の許可も求めない
  lastLoc=Date.now();
  const p=await new Promise(ok=>navigator.geolocation.getCurrentPosition(
    q=>ok({lat:q.coords.latitude,lng:q.coords.longitude,acc:q.coords.accuracy}),()=>ok(null),
    {enableHighAccuracy:false,timeout:8000,maximumAge:60000}));
  if(!p||p.acc>300)return;
  let best=null;
  for(const s of locs){const d=dist(p,s);if(d<=150&&(!best||d<best.d))best={store:s.store,d}}
  if(!best)return;
  const changed=!sameStore(todayStore,best.store);
  setStore(best.store,true);
  if(changed)toast('📍 '+best.store+' にいます');
}

const dayNum=exp=>{const t=new Date();t.setHours(0,0,0,0);return Math.round((new Date(exp+'T00:00:00')-t)/DAY)};
const dlabel=n=>n<0?'期限切れ':n===0?'今日まで':n===1?'明日まで':'あと'+n+'日';

function stockFor(text){
  const t=norm(text);
  return stock.find(s=>{
    const n=norm(s.text);
    if(!n||(s.exp&&dayNum(s.exp)<0))return false;
    return n===t||(Math.min(n.length,t.length)>=2&&(t.includes(n)||n.includes(t)));
  });
}

      const id=uid();reg.push({id,text:v,qty:1,cat:guess(v),store:st});regSel.add(id);saveX();renderPanel();
    };
    ad.onclick=add;inp.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();add()}};
    f.append(inp,sSel,sNew,ad);box.append(f);
  }else{
    const list=[...stock].sort((a,b)=>(a.exp||'9999-99-99')<(b.exp||'9999-99-99')?-1:1);
    if(!list.length)box.append(h('div','none','登録した物はありません'));
    list.forEach(s=>{
      const r=h('div','srow'),nm=h('div','sname');
      const sub=h('span','sub');
      if(s.exp){const n=dayNum(s.exp);sub.textContent=md(s.exp)+'まで（'+dlabel(n)+'）';if(n<0)sub.className='sub late';else if(n<=3)sub.className='sub soon'}
      else sub.textContent='期限なし';
      nm.append(h('b','',s.text),sub);
      const del=h('button','sdel','✕');del.type='button';del.setAttribute('aria-label',s.text+'を削除');
      del.onclick=()=>{const before=JSON.parse(JSON.stringify(stock));stock=stock.filter(x=>x!==s);saveX();renderPanel();render();toast('「'+short(s.text)+'」を削除','元に戻す',()=>{stock=before;saveX();render();if($('sheet2').classList.contains('open'))renderPanel()})};
      r.append(nm,del);box.append(r);
    });
    const f=h('div','sform'),nmI=h('input','fld'),dI=h('input','fld');
    nmI.placeholder='物の名前（例：牛乳）';nmI.setAttribute('aria-label','物の名前');
    dI.type='date';dI.setAttribute('aria-label','期限');
    const ad=h('button','sadd','追加');ad.type='button';
    const go=()=>{const v=nmI.value.trim();if(!v)return;stock.push({id:uid(),text:v,exp:dI.value||''});saveX();renderPanel();render()};
    ad.onclick=go;nmI.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();go()}};
    f.append(nmI,dI,ad);box.append(f);
  }
}
$('bSets').onclick=()=>openPanel('sets');
$('bReg').onclick=()=>openPanel('reg');
$('bStock').onclick=()=>openPanel('stock');
$('m1').onclick=()=>{mode='sets';renderPanel()};
$('m2').onclick=()=>{mode='stock';renderPanel()};
$('m3').onclick=()=>{mode='reg';selectAllReg();renderPanel()};
// 定番は、はじめは全部「いる」にしておく。リストに入っていない物だけ
function selectAllReg(){const S=todayStore;regSel=new Set(reg.filter(s=>!S||!(s.store||'').trim()||sameStore(s.store,S)).map(s=>s.id))}
$('s2Ok').onclick=closeSheet;

// ---- 入力・共有・そのほか ----
$('f').onsubmit=e=>{e.preventDefault();const v=$('t').value.trim();if(!v)return;$('t').value='';$('addStRow').hidden=true;addText(v)};
$('t').oninput=renderSug;
$('clr').onclick=clearDone;
$('dtg').onclick=()=>{doneOpen=!doneOpen;render()};
$('share').onclick=async()=>{
  const pend=items.filter(x=>!x.done);
  if(!pend.length){toast('残りの買い物はないのだ');return}
  let s='🛒 買い物リスト\n';
  for(const c of CATS){
    const g=pend.filter(x=>x.cat===c.id);if(!g.length)continue;
    s+='\n【'+c.name+'】\n'+g.map(x=>'・'+x.text+(x.qty>1?' ×'+x.qty:'')+(x.store?' @'+x.store:'')+(x.memo?'（'+x.memo+'）':'')).join('\n')+'\n';
  }
  try{
    if(navigator.share){await navigator.share({text:s})}
    else{await navigator.clipboard.writeText(s);toast('リストをコピーしました')}
  }catch(e){if(e&&e.name!=='AbortError')toast('共有できませんでした')}
};
// 最安くらべで記録して戻ってきたときに読み直す
addEventListener('pageshow',()=>{render();autoLocate()});
document.addEventListener('visibilitychange',()=>{if(!document.hidden){render();autoLocate()}});
addEventListener('storage',e=>{if(e.key===PC_KEY)render()});
save();render();autoLocate(true);
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js'));
</script>
